<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Declaração Romântica</title>
  <style>
    body {
      text-align: center;
      background-color: #fff0f5;
      font-family: 'Arial', sans-serif;
      padding-top: 100px;
    }

    button {
      padding: 15px 30px;
      font-size: 20px;
      background-color: #ff69b4;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover {
      background-color: #ff1493;
    }

    #mensagem {
      display: none;
      margin-top: 50px;
      font-size: 50px;
      color: #ff1493;
      animation: aparecer 1s ease-in-out forwards;
    }

    .coracoes {
      font-size: 30px;
      color: red;
      margin-top: 20px;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: scale(0.5); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <button onclick="mostrarMensagem()">Clique</button>

  <div id="mensagem">
    EU TE AMO 💖💖💖
    <div class="coracoes">
      ❤️💗💓💞💕❣️💘💝💖💟💌
    </div>
  </div>

  <script>
    function mostrarMensagem() {
      document.getElementById("mensagem").style.display = "block";
    }
  </script>

</body>
</html>
